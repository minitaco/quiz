<title>Hi My love</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Courier New', monospace;
    background: linear-gradient(135deg, #ffb7b2, #ffdac1, #e2f0cb, #b5ead7);
    background-size: 300% 300%;
    animation: gradientShift 15s ease infinite;
    color: #2b2b3a;
    overflow: hidden; 
    height: 100vh;
    height: 100dvh;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ---------- SPARKLES (generated in JS) ---------- */
  .sparkle {
    position: absolute;
    color: #fff;
    opacity: 0;
    animation: floatUpSparkle 5s linear infinite;
    text-shadow: 0 0 5px #fff, 0 0 10px #ff2d55;
    z-index: 1;
    pointer-events: none;
  }

  @keyframes floatUpSparkle {
    0%   { transform: translate(0, 100vh) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translate(var(--drift, 0px), -100px) scale(1.5) rotate(180deg); opacity: 0; }
  }

  /* ---------- PROGRESS BAR ---------- */
  .progress {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    width: min(320px, 70vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 25;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .progress.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .progress-bar {
    width: 100%;
    height: 14px;
    border: 2px solid #2b2b3a;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.45);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff2d55, #ff8fa3);
    border-radius: 999px;
    transition: width 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .progress-label { font-size: 0.8rem; font-weight: bold; color: #2b2b3a; }

  /* ---------- PEEKING BOY ---------- */
  .peeking-boy {
    position: absolute;
    bottom: -400px; 
    width: 300px; 
    height: auto;
    image-rendering: pixelated;
    z-index: 5; 
    transition: bottom 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    left: 50%;
    margin-left: -150px; 
    transform-origin: bottom center;
  }

  .peeking-boy.peek { 
    bottom: -80px; 
    animation: peekWiggle 3s ease-in-out 1.6s infinite;
  }
  .peeking-boy.hide { 
    bottom: -400px; 
    transition: bottom 1s ease-in-out; 
    animation: none;
  }

  @keyframes peekWiggle {
    0%, 100% { transform: rotate(0deg); }
    30%      { transform: rotate(-2deg); }
    70%      { transform: rotate(2deg); }
  }

  /* ---------- MAIN BOY ---------- */
  .main-boy {
    position: absolute;
    bottom: 20%; 
    width: 380px; 
    height: 380px; 
    image-rendering: pixelated;
    z-index: 5; 
    left: 50%;
    margin-left: -190px; 
    opacity: 0;
    transform: scale(0.5) translateY(50px);
    transition: opacity 1s ease, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    
    background-image: url('image/Boy/Boy.png');
    background-size: contain;
    background-position: bottom center;
    background-repeat: no-repeat;
  }

  .main-boy.show { 
    opacity: 1; 
    transform: scale(1) translateY(0); 
    animation: idleFloat 3.2s ease-in-out infinite;
  }

  @keyframes idleFloat {
    0%, 100% { translate: 0 0; }
    50%      { translate: 0 -10px; }
  }

  /* ---------- COUPLE SITTING IMAGE ---------- */
  .couple-image {
    position: absolute;
    bottom: 30%; 
    width: 380px; 
    height: auto;
    image-rendering: pixelated;
    z-index: 4; 
    left: 50%;
    margin-left: -190px; 
    opacity: 0;
    transform: scale(0.8) translateY(30px);
    transition: opacity 1.5s ease, transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
  }

  .couple-image.show { 
    opacity: 1; 
    transform: scale(1) translateY(0); 
    transition-delay: 0.3s;
    animation: coupleFloat 4s ease-in-out 1.8s infinite;
  }

  @keyframes coupleFloat {
    0%, 100% { translate: 0 0; }
    50%      { translate: 0 -8px; }
  }

  /* ---------- COUPLE POSES (holding / hugging / kissing) ---------- */
  .couple-image.pose {
    image-rendering: auto;
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .couple-image.pose.show {
    transition-delay: 0.15s;
    animation-delay: 1s;
  }

  /* the sad boy (1207x1303) sways more slowly than the couple pictures */
  .couple-image.pose.sad-boy.show { animation-duration: 6s; }

  /* ---------- HEART HAPPY ANIMATION ---------- */
  .main-boy.happy {
    background-image: url('image/Boy/Boy-heart.png') !important;
    width: 393.25px !important; 
    height: 666px !important; 
    margin-left: -196.625px !important; 
    background-size: 3146px 666px !important; 
    transition: none !important;
    animation: playHearts 1.0s steps(8) infinite !important; 
    transform: scale(0.65) !important; 
    transform-origin: bottom center;
  }

  @keyframes playHearts {
    from { background-position: 0px 0; }
    to   { background-position: -3146px 0; } 
  }

  /* ---------- CRYING SAD ANIMATION ---------- */
  .main-boy.sad {
    background-image: url('image/Boy/Boy-cry.png') !important;
    width: 393.5px !important; 
    height: 694px !important; 
    margin-left: -196.75px !important; 
    background-size: 3148px 694px !important; 
    transition: none !important;
    animation: playCry 1.0s steps(8) infinite !important; 
    transform: scale(0.65) !important; 
    transform-origin: bottom center;
  }

  @keyframes playCry {
    from { background-position: 0px 0; }
    to   { background-position: -3148px 0; } 
  }

  /* ---------- QUESTION MARK ---------- */
  .question-mark {
    position: absolute;
    bottom: 150px; 
    font-size: 4rem;
    color: #ff2d55;
    font-weight: bold;
    text-shadow: 3px 3px 0 #2b2b3a, 0 0 15px #ff2d55;
    opacity: 0;
    transform: scale(0);
    z-index: 6;
    left: 50%;
    margin-left: -20px; 
    transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .question-mark.show { animation: bounceQuestion 1.5s infinite ease-in-out; opacity: 1; transform: scale(1); }
  @keyframes bounceQuestion { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-15px) scale(1.1); } }

  /* ---------- DIALOGUE BOX ---------- */
  .dialogue-box {
    position: absolute;
    bottom: 250px; 
    left: 5%;
    width: 90%;
    max-width: 600px;
    background: rgba(43, 43, 58, 0.95); 
    border: 4px solid #ffb7b2; 
    border-radius: 15px;
    padding: 25px;
    color: #fff;
    z-index: 20;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    
    opacity: 0;
    transform: translateY(50px);
    transition: 
      opacity 0.8s ease,
      transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275),
      bottom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275),
      border-color 0.35s ease,
      box-shadow 0.35s ease;
  }

  .dialogue-box.visible { opacity: 1; transform: translateY(0); }
  .dialogue-box.move-down { bottom: 30px; }

  .dialogue-box.correct {
    border-color: #7be0a0;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 28px rgba(123, 224, 160, 0.6);
  }
  .dialogue-box.wrong {
    border-color: #ff6b6b;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 28px rgba(255, 107, 107, 0.6);
  }
  .dialogue-box.final {
    border-color: #ff8fa3;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 28px rgba(255, 143, 163, 0.45);
  }
  .dialogue-box.sad-mood {
    border-color: #8aa0c8;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 28px rgba(138, 160, 200, 0.45);
  }
  .dialogue-box.shake { animation: boxShake 0.45s ease; }

  @keyframes boxShake {
    0%, 100% { translate: 0 0; }
    20% { translate: -10px 0; }
    40% { translate: 9px 0; }
    60% { translate: -6px 0; }
    80% { translate: 4px 0; }
  }

  .dialogue-text { font-size: 1.1rem; line-height: 1.6; margin-bottom: 15px; min-height: 70px; }

  /* typing caret + click-to-skip hint */
  .dialogue-text.typing { cursor: pointer; }
  .dialogue-text.typing::after {
    content: '▋';
    margin-left: 2px;
    color: #ffb7b2;
    animation: blink 0.7s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .dialogue-text.pop { animation: textPop 0.35s ease; }
  @keyframes textPop {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* score screen lines */
  .score-line {
    opacity: 0;
    margin-bottom: 12px;
    animation: lineIn 0.5s ease forwards;
    animation-delay: calc(var(--i, 0) * 0.35s);
  }
  @keyframes lineIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- NEXT BUTTON ---------- */
  .next-btn {
    display: none; 
    background: #ff2d55;
    color: white;
    border: none;
    padding: 8px 16px;
    font-family: 'Courier New', monospace;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    float: right;
    transition: transform 0.2s, background 0.2s;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), pulseGlow 1.8s ease-in-out 0.4s infinite;
  }
  .next-btn:hover { background: #ff5c8a; transform: scale(1.05); }
  .next-btn:active { transform: scale(0.96); }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.6) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 45, 85, 0.5); }
    50%      { box-shadow: 0 0 0 8px rgba(255, 45, 85, 0); }
  }

  /* ---------- CHOICES ---------- */
  #choices {
    display: none; 
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  #choices.leaving { opacity: 0; transform: translateY(8px); }

  .choice-btn {
    background: #2b2b3a;
    color: #fff;
    border: 2px solid #ffb7b2;
    padding: 12px;
    font-family: 'Courier New', monospace;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    animation: choiceIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
    animation-delay: calc(var(--i, 0) * 90ms);
  }

  .choice-btn:not(:disabled):hover {
    background: #ff2d55;
    border-color: #fff;
    transform: translateX(10px); 
  }

  .choice-btn:disabled { cursor: default; }
  .choice-btn:disabled:not(.correct):not(.wrong):not(.reveal) { opacity: 0.4; }

  .choice-btn.correct {
    background: #2f9e63;
    border-color: #fff;
    animation: correctPulse 0.5s ease;
  }
  .choice-btn.reveal {
    background: #2f9e63;
    border-color: #fff;
    animation: correctPulse 0.5s ease 0.25s;
  }
  .choice-btn.wrong {
    background: #8b2c3a;
    border-color: #ff6b6b;
    animation: wrongShake 0.4s ease;
  }

  @keyframes choiceIn {
    from { opacity: 0; transform: translateX(-24px); }
  }
  @keyframes correctPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }
  @keyframes wrongShake {
    0%, 100% { translate: 0 0; }
    25% { translate: -8px 0; }
    50% { translate: 8px 0; }
    75% { translate: -5px 0; }
  }

  /* ---------- PARTICLES + FLOATING HEARTS ---------- */
  .particle {
    position: fixed;
    z-index: 30;
    pointer-events: none;
    font-size: 1.6rem;
    animation: particleBurst 1.4s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
  }

  @keyframes particleBurst {
    0% {
      transform: translate(-50%, -50%) scale(0) rotate(0deg);
      opacity: 1;
    }
    25% {
      transform: translate(calc(-50% + var(--dx) * 0.6), calc(-50% + var(--dy) * 0.8)) scale(1.2) rotate(calc(var(--rot) * 0.3));
      opacity: 1;
    }
    100% {
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 160px)) scale(0.7) rotate(var(--rot));
      opacity: 0;
    }
  }

  .float-heart {
    position: fixed;
    bottom: -40px;
    z-index: 3;
    pointer-events: none;
    color: #ff2d55;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    animation: heartRise 7s ease-in forwards;
  }

  @keyframes heartRise {
    0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
    10%  { opacity: 0.9; }
    100% { transform: translate(var(--sway, 0px), -115vh) scale(1.1); opacity: 0; }
  }

  /* ---------- ENDING ---------- */
  .ending-overlay {
    position: fixed;
    inset: 0;
    background: rgba(18, 16, 32, 0);
    z-index: 2;
    pointer-events: none;
    transition: background 2.5s ease;
  }
  .ending-overlay.show { background: rgba(18, 16, 32, 0.62); }

  .ending-line {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translate(-50%, 10px);
    width: min(560px, 88vw);
    text-align: center;
    font-size: 1.2rem;
    line-height: 1.8;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
    z-index: 6;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.8s ease, transform 1.8s ease;
  }
  .ending-line.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- REDUCED MOTION ---------- */
  @media (prefers-reduced-motion: reduce) {
    .sparkle, .particle, .float-heart { display: none; }
    .main-boy.show, .couple-image.show, .peeking-boy.peek, .next-btn { animation: none; }
  }
</style>

  let isInFinalMessage = false;
  let finalMessageIndex = 0;
  let answering = false;

  let typingTimer = null;
  let typingDone = true;
  let currentText = "";
  let heartInterval = null;

  const dialogueBox = document.getElementById('dialogueBox');
  const dialogueText = document.getElementById('dialogueText');
  const nextBtn = document.getElementById('nextBtn');
  const choicesContainer = document.getElementById('choices');
  const boyPeeking = document.getElementById('boyPeeking');
  const mainBoy = document.getElementById('mainBoy');
  const coupleImage = document.getElementById('coupleImage');
  const questionMark = document.getElementById('questionMark');
  const progress = document.getElementById('progress');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');

  const couplePoses = {
    holding: document.getElementById('coupleHolding'),
    hugging: document.getElementById('coupleHugging'),
    kissing: document.getElementById('coupleKissing'),
    sad: document.getElementById('boySad')
  };
  let currentCouple = coupleImage;

  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  /* ================= SAVE TO FIREBASE ================= */
  function saveToDatabase() {
    currentAttempt.score = score;
    
    // Sends the data to your Firestore database under the collection "quiz_results"
    db.collection("quiz_results").add(currentAttempt)
      .then((docRef) => {
        console.log("Document successfully written! ID: ", docRef.id);
      })
      .catch((error) => {
        console.error("Error writing document: ", error);
      });
  }

  /* ================= BACKGROUND MUSIC ================= */
  const bgMusic = document.getElementById('bgMusic');
  const MUSIC_VOLUME = 0.6;
  let musicFade = null;

  function fadeMusic(to, duration, onDone) {
    clearInterval(musicFade);
    const from = bgMusic.volume;
    const steps = Math.max(1, Math.round(duration / 50));
    let i = 0;
    musicFade = setInterval(() => {
      i++;
      bgMusic.volume = Math.min(1, Math.max(0, from + (to - from) * (i / steps)));
      if (i >= steps) {
        clearInterval(musicFade);
        if (onDone) onDone();
      }
    }, 50);
  }

  function startMusic() {
    bgMusic.volume = 0;
    const p = bgMusic.play(); 
    if (p && p.catch) p.catch(() => {}); 
    fadeMusic(MUSIC_VOLUME, 2500);
  }

  function stopMusic(duration = 3000) {
    fadeMusic(0, duration, () => bgMusic.pause());
  }

  /* ================= ENDING ================= */
  const endingLines = [
    "That's everything I wanted to say.",
    "Thank you for reading all of this.",
    "I love you so much love. ❤"
  ];

  const endingOverlay = document.getElementById('endingOverlay');
  const endingLine = document.getElementById('endingLine');

  function playEnding() {
    endingOverlay.classList.add('show'); 

    let i = 0;
    function showLine() {
      endingLine.textContent = endingLines[i];
      endingLine.classList.add('show');

      if (i === endingLines.length - 1) {
        setTimeout(() => stopMusic(4000), 9000);
        return;
      }

      const hold = 2000 + endingLines[i].length * 50;
      setTimeout(() => {
        endingLine.classList.remove('show');
        i++;
        setTimeout(showLine, 1800); 
      }, 1800 + hold);
    }
    setTimeout(showLine, 2200); 
  }

  /* ================= BACKGROUND SPARKLES ================= */
  (function createSparkles() {
    const glyphs = ['✦', '✧', '✦', '✧', '♡'];
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.textContent = pick(glyphs);
      s.style.left = (Math.random() * 100) + '%';
      s.style.fontSize = (0.8 + Math.random() * 1.1) + 'rem';
      const dur = 4 + Math.random() * 4;
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (-Math.random() * dur) + 's'; 
      s.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
      document.body.appendChild(s);
    }
  })();

  /* ================= PARTICLE EFFECTS ================= */
  function burst(emojis, count, originEl) {
    const rect = originEl.getBoundingClientRect();
    const ox = rect.left + rect.width / 2;
    const oy = rect.top + rect.height * 0.4;

    for (let i = 0; i < count; i++) {
      const p = document.createElement('span');
      p.className = 'particle';
      p.textContent = pick(emojis);
      p.style.left = ox + 'px';
      p.style.top = oy + 'px';

      const angle = -Math.PI * (0.1 + Math.random() * 0.8);
      const dist = 120 + Math.random() * 180;
      p.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
      p.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
      p.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
      p.style.animationDuration = (1.1 + Math.random() * 0.8) + 's';
      p.style.fontSize = (1.1 + Math.random() * 1.2) + 'rem';

      p.addEventListener('animationend', () => p.remove());
      document.body.appendChild(p);
    }
  }

  function spawnFloatHeart() {
    if (document.hidden) return;
    const h = document.createElement('span');
    h.className = 'float-heart';
    h.textContent = pick(['❤', '💕', '💖', '💗']);
    h.style.left = (Math.random() * 100) + 'vw';
    h.style.fontSize = (14 + Math.random() * 22) + 'px';
    h.style.animationDuration = (5 + Math.random() * 4) + 's';
    h.style.setProperty('--sway', (Math.random() * 80 - 40) + 'px');
    h.addEventListener('animationend', () => h.remove());
    document.body.appendChild(h);
  }

  function retrigger(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  /* ================= COUPLE PICTURE SWAP ================= */
  function showCouplePose(name, burstEmojis) {
    const next = couplePoses[name];
    if (!next || next === currentCouple) return;

    const prev = currentCouple;
    prev.style.transitionDuration = '0.8s';
    prev.classList.remove('show');
    next.classList.add('show');
    currentCouple = next;

    if (burstEmojis) setTimeout(() => burst(burstEmojis, 14, next), 600);
  }

  /* ================= PROGRESS ================= */
  function updateProgress() {
    progressFill.style.width = (answered / totalQuestions * 100) + '%';
    progressLabel.textContent = `${answered} / ${totalQuestions}`;
  }
  updateProgress();

  /* ================= INTRO ================= */
  window.addEventListener('load', () => {
    setTimeout(() => {
      boyPeeking.classList.add('peek');
      setTimeout(() => {
        questionMark.classList.add('show');
        setTimeout(() => {
          dialogueBox.classList.add('visible');
          typeText(quizStory[0].text);
        }, 1500);
      }, 1000);
    }, 500);
  });

  /* ================= TYPEWRITER ================= */
  function showNextBtn() {
    nextBtn.style.display = "block";
  }

  function typeText(text) {
    clearTimeout(typingTimer);
    currentText = text;
    typingDone = false;

    dialogueText.classList.remove('pop');
    dialogueText.classList.add('typing');
    dialogueText.textContent = "";
    nextBtn.style.display = "none"; 
    choicesContainer.style.display = "none"; 

    const baseSpeed = isInFinalMessage ? 45 : 28;
    let i = 0;

    function type() {
      if (i < text.length) {
        const ch = text.charAt(i);
        dialogueText.textContent += ch;
        i++;
        let delay = baseSpeed;
        if (ch === '.' || ch === '?' || ch === '!') delay += 220;
        else if (ch === ',') delay += 110;
        typingTimer = setTimeout(type, delay);
      } else {
        finishTyping();
      }
    }
    type();
  }

  function finishTyping() {
    clearTimeout(typingTimer);
    dialogueText.textContent = currentText;
    dialogueText.classList.remove('typing');
    typingDone = true;

    if (!isInFinalMessage && quizStory[currentScene] && quizStory[currentScene].action === "quiz") {
      showChoices(quizStory[currentScene].choices);
    } else {
      showNextBtn();
    }
  }

  dialogueText.addEventListener('click', () => {
    if (!typingDone) finishTyping();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (e.target.tagName === 'BUTTON' || e.repeat) return;
    e.preventDefault();
    if (!typingDone) finishTyping();
    else if (nextBtn.style.display === 'block') nextBtn.click();
  });

  function setDialogueHTML(html) {
    dialogueText.classList.remove('typing');
    dialogueText.innerHTML = html;
    retrigger(dialogueText, 'pop');
  }

  /* ================= CHOICES ================= */
  function showChoices(choices) {
    answering = false;
    choicesContainer.innerHTML = ""; 
    choicesContainer.classList.remove('leaving');
    choicesContainer.style.display = "flex";
    
    const correctChoice = choices.find(c => c.isCorrect);

    choices.forEach((choice, idx) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerText = choice.text;
      btn.dataset.correct = choice.isCorrect ? 'true' : 'false';
      btn.style.setProperty('--i', idx);
      btn.onclick = () => handleAnswer(btn, choice.isCorrect, correctChoice.text);
      choicesContainer.appendChild(btn);
    });
  }

  function handleAnswer(clickedBtn, isCorrect, correctAnswerText) {
    if (answering) return;
    answering = true;
    quizStory[currentScene].action = "none"; 

    // 👇 SAVE ANSWER TO MEMORY FOR FIREBASE 👇
    currentAttempt.answers.push({
      question: quizStory[currentScene].text,
      answer: clickedBtn.innerText,
      isCorrect: isCorrect
    });

    const buttons = Array.from(choicesContainer.children);
    buttons.forEach(b => b.disabled = true);
    clickedBtn.classList.add(isCorrect ? 'correct' : 'wrong');
    if (!isCorrect) {
      const right = buttons.find(b => b.dataset.correct === 'true');
      if (right) right.classList.add('reveal');
    }

    answered++;
    updateProgress();

    if (isCorrect) {
      score++; 
      burst(['❤', '💖', '✨', '💕'], 14, mainBoy);
      dialogueBox.classList.add('correct');
      mainBoy.classList.add('happy');
    } else {
      retrigger(dialogueBox, 'shake');
      dialogueBox.classList.add('wrong');
      mainBoy.classList.add('sad');
    }

    setTimeout(() => {
      choicesContainer.classList.add('leaving');
      setTimeout(() => {
        choicesContainer.style.display = "none";
        choicesContainer.classList.remove('leaving');

        if (isCorrect) {
          setDialogueHTML("Tama! Wow, naaalala mo pa rin HAHAHA. ❤");
        } else {
          setDialogueHTML(`Mali! HAHAHA. I'm judging you a little bit right now. 😭<br><br>Ang tamang sagot is <b>${correctAnswerText}</b>.`);
        }

        nextBtn.innerText = "Continue ➔";
        showNextBtn();
      }, 220);
    }, 650);
  }

  /* ================= BOY RESET (ghosting fix) ================= */
  function clearBoyAnimation() {
    mainBoy.style.transition = 'none';
    mainBoy.classList.remove('happy');
    mainBoy.classList.remove('sad');
    void mainBoy.offsetWidth;
    mainBoy.style.transition = '';
  }

  /* ================= SCORE COUNT-UP ================= */
  function countUp(el, to, duration = 900) {
    if (to === 0) { el.textContent = 0; return; }
    const start = performance.now();
    function tick(now) {
      const p = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(to * eased);
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  /* ================= SAD MOOD ================= */
  function enterSadMood() {
    clearInterval(heartInterval);
    dialogueBox.classList.remove('final');
    dialogueBox.classList.add('sad-mood');
  }

  /* ================= FINAL MESSAGE PLAYER ================= */
  function playFinalPart(index) {
    const part = finalMessageStory[index];

    typeText(part.text);

    if (part.mood === 'sad') enterSadMood();
    if (part.image) showCouplePose(part.image, part.burst);

    nextBtn.innerText = (index === finalMessageStory.length - 1) ? "Finish ❤" : "Continue ➔";
  }

  /* ================= SCENE FLOW ================= */
  function nextScene() {
    clearBoyAnimation();
    dialogueBox.classList.remove('correct', 'wrong', 'shake');
    
    if (isInFinalMessage && finalMessageIndex >= finalMessageStory.length) {
      dialogueBox.classList.remove('visible');
      nextBtn.style.display = "none";
      playEnding(); 
      if (currentCouple !== couplePoses.sad) burst(['❤', '💖', '💕', '✨'], 28, currentCouple);
      return;
    }

    if (isInFinalMessage) {
      playFinalPart(finalMessageIndex);
      finalMessageIndex++;
      return;
    }

    if (isQuizOver) {
      isQuizOver = false;
      isInFinalMessage = true;
      finalMessageIndex = 0;
      
      progress.classList.remove('show');
      dialogueBox.classList.add('final');

      startMusic();

      mainBoy.style.opacity = "0";
      coupleImage.classList.add('show');

      for (let i = 0; i < 6; i++) setTimeout(spawnFloatHeart, i * 250);
      heartInterval = setInterval(spawnFloatHeart, 450);
      
      playFinalPart(finalMessageIndex);
      finalMessageIndex++;
      return;
    }

    currentScene++;
    
    if (currentScene < quizStory.length) {
      
      if (quizStory[currentScene].action === "intro_end") {
        boyPeeking.classList.remove('peek');
        boyPeeking.classList.add('hide');
        questionMark.classList.remove('show');
        
        mainBoy.classList.add('show');
        dialogueBox.classList.add('move-down'); 
        progress.classList.add('show');
      }

      typeText(quizStory[currentScene].text);

    } else {
      // 👇 QUIZ IS DONE: SAVE TO FIREBASE 👇
      saveToDatabase();

      let finalMessage = "";
      
      if (score === totalQuestions) {
        finalMessage = "Perfect score! You really do know me inside and out. ❤";
        burst(['❤', '💖', '✨', '💕', '🎉'], 26, mainBoy);
        mainBoy.classList.add('happy');
      } else if (score >= totalQuestions - 2) {
        finalMessage = "Wow galing! You know me really well. 😊";
      } else if (score >= 3) {
        finalMessage = "Pwede na, but I think you can do better! HAHAHA.";
      } else {
        finalMessage = "hmm... you're already slowly forgetting me. 🙁";
        mainBoy.classList.add('sad');
      }

      typingDone = true;
      setDialogueHTML(`
        <div class="score-line" style="--i:0"><b>Quiz Complete!</b></div>
        <div class="score-line" style="--i:1">You got <b id="scoreNum">0</b> out of <b>${totalQuestions}</b> correct.</div>
        <div class="score-line" style="--i:2">${finalMessage}</div>
      `);
      dialogueText.classList.remove('pop');

      setTimeout(() => countUp(document.getElementById('scoreNum'), score), 450);

      nextBtn.style.display = "none";
      nextBtn.innerText = "Continue ➔";
      isQuizOver = true;
      setTimeout(showNextBtn, 1400);
    }
  }
</script>
